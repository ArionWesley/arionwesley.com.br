<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-807E9bG1ZN/1hTb6okNKkyBgb2v2FGi5BegU/TX34lw='; style-src 'sha256-kshWqd6r7QvRRop1vu6Gw+yO1waDIf1shcOx7EOA7Y4='; connect-src https://dvmtzobsynzbkewyglci.supabase.co; img-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Evolui · Painel do paciente</title>
<!--
  v0.224.90 — a página do celular do QR do passômetro da extensão Evolui (o painel do paciente, só para ler, por 4 h).
  Fica em https://arionwesley.com.br/evolui/ (este arquivo é o index.html dessa pasta), como a /foto/ do Regula UPA.
  O QR de cada paciente abre: https://arionwesley.com.br/evolui/#<o id da cópia>.<a chave> — o fragmento (depois do "#")
  não vai a servidor nenhum. A página pede a cópia cifrada ao Supabase da Evolui pelo id (o RPC passometro_ler) e a abre
  aqui com a chave. Nada fica neste site: ele só entrega esta página.
  A CSP leva o hash do estilo e do script daqui: mudou um dos dois, o hash muda junto (o testes/passometro_qr.test.js
  confere e diz o novo).
-->
<style>
  :root { --tinta: #102a43; --texto: #243b53; --mudo: #52606d; --linha: #e4e7eb; --fundo: #f4f6fa; --azul: #1e40af; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--fundo); color: var(--texto); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  .topo { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--linha); background: #fff; }
  .topo b { color: var(--azul); }
  .validade { margin-left: auto; color: var(--mudo); font-size: 14px; white-space: nowrap; }
  main { max-width: 720px; margin: 0 auto; padding: 12px 16px calc(32px + env(safe-area-inset-bottom)); }
  .aviso { margin: 40px 0; color: var(--mudo); text-align: center; }
  .cabeca { display: flex; gap: 12px; margin-bottom: 12px; padding: 12px; border: 1px solid var(--linha); border-radius: 10px; background: #fff; }
  /* (a faixa do leito, a do passômetro) */
  .faixa { display: flex; flex: none; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 64px; padding: 6px 8px; border-radius: 8px;
    background: #111; color: #fff; text-align: center; }
  .faixa .leito { font-size: 20px; font-weight: 700; line-height: 1.1; overflow-wrap: anywhere; }
  .faixa .sit { font-size: 12px; font-weight: 700; }
  .quem { min-width: 0; }
  .quem h1 { margin: 0; color: var(--tinta); font-size: 19px; line-height: 1.25; overflow-wrap: anywhere; }
  .sobre { margin: 2px 0 0; color: var(--mudo); font-size: 14px; }
  .alergia { display: inline-block; margin: 6px 0 0; padding: 1px 10px; border-radius: 999px; background: #fee2e2; color: #991b1b; font-size: 14px; font-weight: 700; }
  .alergia.sem { padding: 0; background: none; color: var(--mudo); font-weight: 400; }
  .secao { margin-bottom: 10px; padding: 10px 12px; border: 1px solid var(--linha); border-radius: 10px; background: #fff; }
  .secao h2 { margin: 0 0 4px; color: var(--tinta); font-size: 13px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; }
  .secao p { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  .secao p + p { margin-top: 4px; }
  .pendencias { margin: 0; padding-left: 20px; }
  .pendencias li + li { margin-top: 4px; }
  .pendencias .atrasada { color: #991b1b; font-weight: 700; }
  .quando { color: var(--mudo); font-weight: 400; }
  .pe { margin: 16px 0 0; color: var(--mudo); font-size: 13px; text-align: center; }
</style>
</head>
<body>
<div class="topo"><b>Evolui</b><span class="validade" id="validade"></span></div>
<main>
  <p class="aviso" id="aviso">Abrindo o painel…</p>
  <article class="painel" id="painel" hidden></article>
  <noscript><p class="aviso">Ligue o JavaScript do navegador para abrir o painel.</p></noscript>
</main>
<script>
(function () {
  'use strict';

  // o projeto do Supabase da Evolui (conta_config.js da extensão): o endereço e a chave publishable — públicos de verdade
  // (quem protege é o RPC: só a cópia no prazo, pelo id)
  const SUPABASE_URL = 'https://dvmtzobsynzbkewyglci.supabase.co';
  const CHAVE_PUBLICA = 'sb_publishable_NXkTs9bp4zyO6Q9Zla8Y-w_Vn_XBm7z';
  const AAD = new TextEncoder().encode('evolui-qr-1'); // (o mesmo do passometro_qr.js)
  const deBase64 = (t) => Uint8Array.from(atob(t), (c) => c.charCodeAt(0));
  const deBase64url = (t) => deBase64(t.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - (t.length % 4)) % 4));

  // o fragmento ("#<o id, 22>.<a chave, 22>") → { id (o uuid), chave (16 bytes) } | null
  function lerFragmento(fragmento) {
    const m = /^#?([A-Za-z0-9_-]{22})\.([A-Za-z0-9_-]{22})$/.exec(String(fragmento || ''));
    if (!m) return null;
    const h = Array.from(deBase64url(m[1]), (b) => b.toString(16).padStart(2, '0')).join('');
    return { id: `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`, chave: deBase64url(m[2]) };
  }
  // a cifra (base64: [o iv, 12][a cifra AES-GCM]) → a cópia; a chave errada ou a cifra mexida: o erro do WebCrypto
  async function abrir(cifra, chaveBruta) {
    const tudo = deBase64(cifra);
    const chave = await crypto.subtle.importKey('raw', chaveBruta, 'AES-GCM', false, ['decrypt']);
    const claro = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: tudo.slice(0, 12), additionalData: AAD }, chave, tudo.slice(12));
    return JSON.parse(new TextDecoder().decode(claro));
  }
  // (nos testes, no Node: só estas duas — testes/passometro_qr.test.js)
  if (typeof document === 'undefined') { module.exports = { lerFragmento, abrir }; return; }

  const $ = (id) => document.getElementById(id);
  const texto = (v) => (typeof v === 'string' ? v : typeof v === 'number' ? String(v) : '');
  const lista = (v) => (Array.isArray(v) ? v.filter((x) => x && typeof x === 'object') : []);
  function el(tag, classe, conteudo) {
    const e = document.createElement(tag);
    if (classe) e.className = classe;
    if (conteudo) e.textContent = conteudo;
    return e;
  }
  const hora = (ms) => new Date(ms).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  let relogio = null;

  function fechar(aviso) {
    clearTimeout(relogio);
    $('painel').replaceChildren();
    $('painel').hidden = true;
    $('validade').textContent = '';
    $('aviso').textContent = aviso;
    $('aviso').hidden = false;
  }

  // → { ok: true, cifra, expira_em } | { ok: false, motivo: 'vencida' | 'muitas' } | null (sem resposta)
  async function buscar(id) {
    try {
      const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/passometro_ler`, { method: 'POST', cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer',
        headers: { apikey: CHAVE_PUBLICA, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_id: id }) });
      return r.ok ? await r.json() : null;
    } catch (e) {
      return null;
    }
  }
  const RECUSA = Object.freeze({
    vencida: 'Este QR venceu. Peça a folha nova do passômetro.', // (v0.224.127: sem o "ou foi cancelado" — o cancelar saiu)
    muitas: 'Muitas tentativas desta rede: espere alguns minutos e escaneie de novo.',
  });

  // o painel: o leito e a situação, o nome, o D e a clínica, as alergias; as seções do painel; as pendências — tudo pelo
  // textContent (nada da cópia vira HTML)
  function mostrar(c, expiraEm) {
    const painel = $('painel');
    const cabeca = el('header', 'cabeca');
    const faixa = el('div', 'faixa');
    faixa.append(el('span', 'leito', texto(c.leito) || '—'), el('span', 'sit', texto(c.situacao)));
    const quem = el('div', 'quem');
    quem.append(el('h1', '', texto(c.nome) || 'Paciente'), el('p', 'sobre', texto(c.sobre)));
    if (texto(c.alergias)) quem.append(el('p', c.semAlergia ? 'alergia sem' : 'alergia', `Alergias: ${texto(c.alergias)}`));
    cabeca.append(faixa, quem);
    painel.replaceChildren(cabeca);
    for (const s of lista(c.secoes)) {
      const linhas = (Array.isArray(s.linhas) ? s.linhas : []).map(texto).filter(Boolean);
      if (!linhas.length) continue;
      const secao = el('section', 'secao');
      secao.append(el('h2', '', texto(s.titulo)), ...linhas.map((l) => el('p', '', l)));
      painel.append(secao);
    }
    const pendencias = lista(c.pendencias).filter((p) => texto(p.texto));
    if (pendencias.length) {
      const ul = el('ul', 'pendencias');
      for (const p of pendencias) {
        const li = el('li', p.atrasada ? 'atrasada' : '', texto(p.texto));
        if (texto(p.quando)) li.append(el('span', 'quando', ` — ${texto(p.quando)}`));
        ul.append(li);
      }
      const secao = el('section', 'secao');
      secao.append(el('h2', '', 'Pendências'), ul);
      painel.append(secao);
    }
    const impresso = Number(c.impresso) > 0 ? `às ${hora(Number(c.impresso))}` : '';
    painel.append(el('p', 'pe', ['Só leitura', [texto(c.medico) && `impresso por ${texto(c.medico)}`, impresso].filter(Boolean).join(' ')].filter(Boolean).join(' · ')));
    $('aviso').hidden = true;
    painel.hidden = false;
    $('validade').textContent = `válido até ${hora(expiraEm)}`;
    clearTimeout(relogio);
    relogio = setTimeout(() => fechar('Este QR venceu (4 h): o painel saiu da tela.'), Math.max(0, expiraEm - Date.now()));
  }

  let aberto = null; // { id, expiraEm }
  async function comecar() {
    const f = lerFragmento(location.hash);
    if (!f) { fechar('Endereço incompleto: escaneie o QR de novo.'); return; }
    if (!window.crypto || !crypto.subtle) { fechar('Este navegador não abre o painel: atualize-o ou use outro.'); return; }
    const r = await buscar(f.id);
    if (!r) { fechar('Sem conexão com o servidor: confira a internet e escaneie de novo.'); return; }
    if (r.ok !== true) { fechar(RECUSA[r.motivo] || RECUSA.vencida); return; }
    let copia = null;
    try { copia = await abrir(String(r.cifra || ''), f.chave); } catch (e) { /* a chave não confere */ }
    if (!copia || typeof copia !== 'object') { fechar('Este QR não abre o painel (a chave não confere): escaneie de novo.'); return; }
    aberto = { id: f.id, expiraEm: Number(r.expira_em) };
    mostrar(copia, aberto.expiraEm);
  }
  // (a página que volta a ficar à vista: vencida aqui, ou lá pelo relógio do servidor — o painel sai; sem resposta, fica
  // até o prazo)
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible' || !aberto) return;
    if (Date.now() >= aberto.expiraEm) { fechar('Este QR venceu (4 h): o painel saiu da tela.'); return; }
    const r = await buscar(aberto.id);
    if (r && r.ok === false && r.motivo === 'vencida') { aberto = null; fechar(RECUSA.vencida); }
  });
  // (um QR novo lido com esta página aberta: só o "#" muda e o navegador não recarrega)
  window.addEventListener('hashchange', () => location.reload());
  comecar();
})();
</script>
</body>
</html>
